<!doctype html>
<html lang="zh-CN" data-style="ledger" data-font="wenkai">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自定义常用功能 · 五套方案</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css">
    <link rel="stylesheet" href="../../src/styles/base.css">
    <link rel="stylesheet" href="./shortcut-editor-options.css">
    <script type="importmap">
        {"imports":{
            "@dnd-kit/dom":"/vendor/@dnd-kit/dom/index.js",
            "@dnd-kit/dom/sortable":"/vendor/@dnd-kit/dom/sortable.js",
            "@dnd-kit/dom/utilities":"/vendor/@dnd-kit/dom/utilities.js",
            "@dnd-kit/state":"/vendor/@dnd-kit/state/dist/index.mjs",
            "@dnd-kit/abstract":"/vendor/@dnd-kit/abstract/index.js",
            "@dnd-kit/geometry":"/vendor/@dnd-kit/geometry/dist/index.mjs",
            "@dnd-kit/collision":"/vendor/@dnd-kit/collision/dist/index.js",
            "@preact/signals-core":"/vendor/@preact/signals-core/dist/signals-core.mjs",
            "tslib":"/vendor/tslib/tslib.es6.mjs"
        }}
    </script>
</head>
<body>

    <main class="preview-page">
        <header class="page-intro">
            <div><p class="eyebrow">梦幻助手 / 入口编排</p><h1>挑得清楚，排得顺手。</h1><p class="intro-note">五种布局，同一份内容。可以添加、移除、拖动排序，再选你喜欢的一套。</p></div>
            <span class="edition">交互提案 · 03</span>
        </header>
        <div class="preview-toolbar" aria-label="预览设置">
            <div class="scheme-switch" role="group" aria-label="查看方案"></div>
            <div class="appearance">
                <label>主题 <select id="theme"><option value="ledger">账簿</option><option value="celadon">青瓷</option><option value="azure">霁蓝</option><option value="crystal">水晶</option><option value="dunhuang">敦煌岩彩</option><option value="rosewood">紫檀书斋</option></select></label>
                <label>字体 <select id="font"><option value="wenkai">文楷</option><option value="sans">黑体</option><option value="rounded">圆体</option></select></label>
                <button type="button" class="control" id="dark" aria-pressed="false">暗色</button>
                <button type="button" class="control" id="compact" aria-pressed="false">紧凑宽度</button>
            </div>
        </div>
        <div class="interaction-note"><span class="ready-dot" aria-hidden="true"></span><span id="engine-status" role="status">正在准备交互方案…</span><span class="keyboard-note">键盘：空格拿起 · 方向键移动 · Esc 取消</span></div>
        <div id="gallery"></div>
        <footer class="page-footer"><p>拖拽使用 dnd-kit 0.5.3，同一套浮层、让位和落位反馈。演示不改正式首页。</p><p id="choice" role="status" aria-live="polite">选好后告诉我方案字母即可。</p></footer>
    </main>
    <script type="module">
        import('./shortcut-editor-options.js').catch(() => {
            document.querySelector('#engine-status').textContent = '交互模块未加载，请通过本地预览服务打开此页。';
        });
    </script>
</body>
</html>
