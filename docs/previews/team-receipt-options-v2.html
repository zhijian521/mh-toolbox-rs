<!doctype html>
<html lang="zh-CN" data-style="ledger" data-font="wenkai">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的队伍 · 小票方案第二版</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css">
    <link rel="stylesheet" href="../../src/styles/base.css">
    <style>
        /* 提案中的造型使用局部几何；配色、字体与材质锚点引用项目唯一入口。 */
        html { scroll-behavior: smooth; scroll-padding-top: 150px; }
        body { height: auto; min-height: 100vh; background: var(--bg); }
        button, select { font: inherit; }
        button { cursor: pointer; }
        button, a, select { touch-action: manipulation; }
        button:focus-visible, a:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: var(--ring); outline-offset: 4px; }
        [hidden] { display: none !important; }
        .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
        .shell { max-width: 1352px; margin: auto; padding: 42px 40px 64px; }
        .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding-bottom: 26px; }
        .edition { color: var(--accent); font-size: var(--fs-xs); letter-spacing: .16em; margin-bottom: 8px; }
        h1 { font-size: 29px; line-height: 1.4; }
        .intro p { color: var(--muted); font-size: var(--fs-sm); margin-top: 9px; }
        .old-version { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; text-decoration: underline; text-underline-offset: 4px; padding-bottom: 4px; }
        .controls { position: sticky; z-index: 50; top: 0; padding: 13px 0 11px; background: var(--bg); border-block: 1px solid var(--rule-2); }
        .settings, .settings-start, .settings-end { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
        .settings { justify-content: space-between; gap: 12px 20px; }
        .settings-start { font-size: var(--fs-xs); color: var(--muted); }
        .settings-start span { margin-right: 4px; }
        .settings label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: var(--fs-xs); }
        select, .control { background: var(--paper); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 4px; font-size: var(--fs-sm); min-height: 31px; padding: 5px 10px; }
        select { padding-right: 22px; }
        .control:hover { border-color: var(--rule-2); }
        .control[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
        .scheme-nav { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding: 12px 2px 2px; }
        .scheme-nav::-webkit-scrollbar { display: none; }
        .scheme-nav button { flex: none; display: flex; align-items: center; gap: 7px; background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 3px; padding: 5px 9px; font-size: var(--fs-sm); }
        .scheme-nav b { color: var(--accent); font-weight: 400; }
        .scheme-nav button:hover { background: var(--paper-2); color: var(--ink); }
        .scheme-nav button[aria-pressed="true"] { background: var(--paper); border-color: var(--rule-2); color: var(--ink); }
        .recommendation { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 19px 0 1px; color: var(--muted); font-size: var(--fs-xs); }
        .recommendation a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; margin-right: 14px; }
        .proposal { padding-top: 28px; margin-bottom: 8px; }
        .proposal-head { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 15px; }
        .proposal-title { display: flex; gap: 14px; align-items: center; }
        .letter { font-size: 34px; line-height: 1; width: 34px; color: var(--accent); font-weight: 400; }
        .proposal h2 { font-size: 18px; line-height: 1.5; }
        .proposal-head p { font-size: var(--fs-sm); color: var(--muted); margin-top: 3px; }
        .new-label { display: inline-block; margin-left: 9px; color: var(--accent); font-size: var(--fs-mini); border: 1px solid var(--rule-2); border-radius: 2px; padding: 0 5px; vertical-align: 2px; }
        .pick { flex: none; color: var(--ink-2); border: 1px solid var(--rule-2); background: var(--paper); border-radius: 4px; padding: 7px 13px; font-size: var(--fs-sm); box-shadow: inset 0 1px 0 var(--bevel-hi), 0 2px 0 var(--rule); }
        .pick:hover { border-color: var(--accent); color: var(--accent); }
        .pick[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent-ink); }
        .preview { container: preview / inline-size; margin-inline: auto; }
        body.compact .preview { max-width: 780px; }
        .team-board { padding: 17px 18px 4px; }
        .board-head { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 0 2px; }
        .board-title { display: flex; gap: 8px; align-items: center; }
        .board-title h3 { font-size: var(--fs-md); }
        .board-actions { display: flex; align-items: center; gap: 13px; }
        .text-button { border: 0; background: none; color: var(--muted); font-size: var(--fs-xs); padding: 4px 0; }
        .text-button:hover { color: var(--accent); }
        .arrows { display: flex; gap: 5px; }
        .arrow { border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); color: var(--ink-2); width: 27px; height: 25px; display: grid; place-items: center; font-size: 18px; line-height: 1; }
        .arrow:hover { border-color: var(--rule-2); }
        .receipts { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: min(300px, 95%); align-items: start; gap: 27px; overflow-x: auto; overflow-y: hidden; padding: 38px 13px 36px; scrollbar-width: none; scroll-snap-type: x proximity; overscroll-behavior-x: contain; }
        .receipts::-webkit-scrollbar { display: none; }
        .ticket {
            --sheet: var(--paper);
            --sheet-edge: color-mix(in srgb, var(--sheet) 76%, var(--rule-2));
            --shade: color-mix(in srgb, var(--ink-base) 17%, transparent);
            --light: color-mix(in srgb, var(--paper-base) 60%, transparent);
            position: relative; isolation: isolate; height: 374px; min-width: 0; scroll-snap-align: start;
        }
        /* 影子、底纸、正面分开，纸边切口也切掉投影，不给正文做透视变形。 */
        .cast, .back, .surface, .hardware, .tape, .curl { position: absolute; pointer-events: none; }
        .cast { z-index: 0; bottom: 2px; left: 7px; right: 2px; height: 28px; background: var(--shade); filter: blur(7px); border-radius: 50%; transform: rotate(-2deg); }
        .back { z-index: 1; inset: 0; }
        .surface { z-index: 2; inset: 0; border: 1px solid var(--sheet-edge); border-radius: 2px; background: var(--sheet); box-shadow: inset 0 1px 0 var(--light), 0 1px 2px var(--shadow); }
        .surface::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--ink-base); filter: url('#paper-fibre'); opacity: .035; }
        .surface::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(103deg, var(--light), transparent 18% 82%, color-mix(in srgb, var(--ink-base) 3%, transparent)); opacity: .45; }
        .ticket-content { position: relative; z-index: 3; display: flex; flex-direction: column; height: 100%; padding: 16px 19px 17px; color: var(--ink-2); }
        .printline { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 9px; line-height: 1.5; letter-spacing: .12em; margin-bottom: 10px; }
        .print-number { font-variant-numeric: tabular-nums; font-size: 10px; letter-spacing: .08em; }
        .identity { display: flex; align-items: start; gap: 9px; min-width: 0; padding-bottom: 12px; border-bottom: 1px dashed var(--rule-2); }
        .identity-copy { flex: 1; min-width: 0; }
        .name { display: block; padding: 0; max-width: 100%; border: 0; background: none; color: var(--ink); font-size: 19px; line-height: 1.45; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; }
        .name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
        .school { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 4px; color: var(--muted); font-size: var(--fs-xs); }
        .school .level { color: var(--ochre); font-variant-numeric: tabular-nums; }
        .profile-arrow { color: var(--rule-2); padding-top: 4px; font-size: 19px; }
        .records { flex: 1; min-height: 0; padding-top: 6px; display: grid; align-content: start; }
        .record { padding: 9px 0; min-width: 0; }
        .record + .record { border-top: 1px dotted var(--rule); }
        .record h4 { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: var(--fs-xs); line-height: 1.4; margin-bottom: 6px; }
        .record h4 .icon { width: 12px; height: 12px; }
        .entry { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: var(--fs-sm); line-height: 1.6; }
        .entry + .entry { margin-top: 6px; }
        .entry-copy { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .value { flex: none; font-size: var(--fs-base); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--indigo-ink); }
        .date { flex: none; color: var(--muted); font-size: var(--fs-mini); }
        .gain, .direction { color: var(--positive); }
        .loss, .direction.out { color: var(--negative); }
        .direction { margin-right: 4px; font-size: var(--fs-mini); }
        .empty { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; }
        .ticket-foot { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 9px; padding-top: 10px; border-top: 1px dashed var(--rule-2); color: var(--muted); font-size: var(--fs-mini); line-height: 1.4; }
        .ticket-foot small { font: inherit; letter-spacing: .09em; opacity: .7; }
        .state { display: inline-flex; align-items: center; gap: 5px; }
        .state.online { color: var(--positive); }
        .state.online::before { content: ''; width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
        .hardware, .tape, .curl { z-index: 5; }
        .hardware, .tape, .curl, .back { display: none; }
        .detail-note { display: flex; flex-wrap: wrap; gap: 7px 23px; padding: 13px 2px 0; font-size: var(--fs-xs); color: var(--muted); }
        .detail-note span::before { content: '·'; color: var(--accent); margin-right: 6px; }

        /* A 热敏票：薄边，不规则裁切，靠纸下两侧的翘影体现轻度弯曲。 */
        .scheme-a .ticket { transform: rotate(-.35deg); }
        .scheme-a .ticket:nth-child(even) { transform: rotate(.25deg); }
        .scheme-a .cast { bottom: -3px; height: 55px; left: 2px; right: 2px; background: radial-gradient(ellipse at 6% 65%, var(--shade), transparent 53%), radial-gradient(ellipse at 94% 65%, var(--shade), transparent 53%); filter: blur(5px); }
        .scheme-a .surface { border: 0; filter: drop-shadow(0 1px 0 var(--sheet-edge)) drop-shadow(0 2px 2px var(--shadow)); clip-path: polygon(0 0, 100% 0, 100% 98%, 98% 99.5%, 96% 98.5%, 93% 100%, 90% 98.7%, 87% 99.5%, 84% 98.7%, 81% 100%, 77% 98.7%, 73% 99.6%, 70% 98.6%, 66% 100%, 62% 98.8%, 58% 99.5%, 54% 98.6%, 50% 100%, 46% 98.6%, 42% 99.5%, 38% 98.8%, 34% 100%, 30% 98.6%, 26% 99.6%, 22% 98.7%, 18% 100%, 14% 98.7%, 10% 99.7%, 6% 98.5%, 3% 100%, 0 98.5%); background: linear-gradient(90deg, color-mix(in srgb, var(--sheet) 94%, var(--ink-base)), var(--sheet) 7% 92%, color-mix(in srgb, var(--sheet) 96%, var(--ink-base))); }
        .scheme-a .identity { text-align: center; }
        .scheme-a .name { margin: auto; }
        .scheme-a .school { justify-content: center; }
        .scheme-a .profile-arrow { display: none; }
        .scheme-a .printline { border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
        .scheme-a .curl { display: block; bottom: 0; left: 7%; right: 7%; height: 5px; border-radius: 0 0 50% 50%; background: linear-gradient(var(--sheet), var(--sheet-edge)); opacity: .5; z-index: 1; }

        /* B 杯身贴签：受弧面影响的侧光、薄胶层与真正揭起的角。 */
        .scheme-b .ticket { --sheet: color-mix(in srgb, var(--paper) 97%, var(--paper-base)); }
        .scheme-b .cast { inset: 18px 3px 3px 3px; height: auto; border-radius: 40% / 7%; filter: blur(9px); background: color-mix(in srgb, var(--ink-base) 20%, transparent); }
        .scheme-b .surface { border-radius: 6px 6px 13px 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--sheet) 88%, var(--rule-2)), var(--sheet) 13% 75%, color-mix(in srgb, var(--sheet) 92%, var(--rule-2))); box-shadow: inset 1px 0 1px var(--light), inset -1px 0 1px var(--shade), 0 1px 0 var(--sheet-edge); }
        .scheme-b .ticket-content { padding-inline: 21px; }
        .scheme-b .printline { color: var(--accent); letter-spacing: .06em; border-bottom: 2px solid var(--accent); padding-bottom: 7px; }
        .scheme-b .name { font-size: 22px; color: var(--ink); }
        .scheme-b .identity { border-bottom-style: solid; }
        .scheme-b .ticket-foot { padding-right: 18px; }
        .scheme-b .curl { display: block; width: 27px; height: 27px; bottom: 0; right: 0; background: linear-gradient(135deg, transparent 48%, var(--sheet-edge) 49%, var(--paper-2) 53%, var(--light) 90%); border-radius: 0 0 11px 0; filter: drop-shadow(-2px -2px 1px var(--shadow)); }

        /* C 出单夹轨：拉丝窄轨、夹片折边、压点接触影，阴影向纸尾展开。 */
        .scheme-c .receipts { padding-top: 42px; background: linear-gradient(180deg, var(--bevel-hi), var(--rule) 24%, var(--paper-2) 60%, var(--rule-2) 94%, var(--bevel-lo)) 0 23px / 100% 11px no-repeat; }
        .scheme-c .surface { box-shadow: inset 0 1px 0 var(--light), 0 1px 2px var(--shadow); }
        .scheme-c .cast { inset: 35% 3px -7px 10px; height: auto; border-radius: 4px 4px 18% 10%; transform: skewX(-2deg); filter: blur(9px); }
        .scheme-c .ticket-content { padding-top: 20px; }
        .scheme-c .hardware { display: block; width: 34px; height: 25px; top: -14px; left: calc(50% - 17px); border: 1px solid var(--rule-2); border-radius: 3px 3px 5px 5px; background: repeating-linear-gradient(90deg, transparent 0 1px, color-mix(in srgb, var(--paper-base) 8%, transparent) 1px 2px), linear-gradient(180deg, var(--paper-2), var(--rule-2) 12%, var(--light) 18%, var(--rule) 35% 68%, var(--rule-2) 72%, var(--paper-2) 76%, var(--rule-2)); box-shadow: inset 1px 0 0 var(--light), inset -1px 0 0 var(--shade), 0 2px 1px var(--shade), 0 5px 5px -3px var(--shade); }
        .scheme-c .hardware::before { content: ''; position: absolute; top: -7px; left: 7px; width: 18px; height: 12px; border: 2px solid var(--rule-2); border-radius: 7px 7px 2px 2px; box-shadow: inset 1px 1px 0 var(--light), 1px 0 0 var(--light); }
        .scheme-c .identity { border-bottom-style: solid; }
        .scheme-c .ticket:nth-child(2n) .surface, .scheme-c .ticket:nth-child(2n) .ticket-content { transform: rotate(.3deg); transform-origin: top center; }

        /* D 复写三联：底联有独立边缘，厚度来自真实露出的两页。 */
        .scheme-d .ticket { transform: rotate(-.25deg); }
        .scheme-d .back { display: block; inset: 4px -3px -4px 3px; background: color-mix(in srgb, var(--moss) 12%, var(--paper)); border: 1px solid var(--sheet-edge); box-shadow: 0 1px 0 var(--light); }
        .scheme-d .back::after { content: ''; position: absolute; z-index: -1; inset: 2px -3px -4px 2px; border: 1px solid var(--sheet-edge); background: color-mix(in srgb, var(--ochre) 12%, var(--paper)); }
        .scheme-d .cast { bottom: -9px; left: 7px; right: -4px; height: 24px; filter: blur(6px); }
        .scheme-d .surface { border-radius: 0; box-shadow: inset 0 1px 0 var(--light), 1px 1px 1px var(--shade); }
        .scheme-d .printline { color: var(--indigo-ink); margin: -3px -18px 12px; padding: 7px 17px 8px; border-bottom: 1px dashed var(--rule-2); background: color-mix(in srgb, var(--indigo) 30%, transparent); }
        .scheme-d .name { color: var(--indigo-ink); }
        .scheme-d .identity { border-bottom: 3px double var(--rule-2); }
        .scheme-d .record + .record { border-top-style: dashed; }
        .scheme-d .record { padding-block: 7px; }
        .scheme-d .hardware { display: block; width: 22px; height: 5px; top: 7px; left: 28px; border: 1px solid var(--rule-2); border-radius: 2px; background: linear-gradient(var(--light), var(--rule-2)); box-shadow: 0 1px 1px var(--shade); transform: rotate(-7deg); }
        .scheme-d .ticket-content { padding-top: 20px; }
        .scheme-d .printline span:first-child { padding-left: 30px; }

        /* E 撕页账单：装订孔穿透纸张，旁边留撕线，纸面保留淡折痕。 */
        .scheme-e .ticket { --tear-mask: radial-gradient(circle at 10px 10px, transparent 2.8px, var(--ink-base) 3.4px) 0 0 / 100% 23px repeat-y; filter: drop-shadow(0 1px 0 var(--sheet-edge)) drop-shadow(1px 4px 3px var(--shadow-lg)); }
        .scheme-e .cast { display: none; }
        .scheme-e .surface { border: 0; border-radius: 0; -webkit-mask: var(--tear-mask); mask: var(--tear-mask); background: linear-gradient(90deg, var(--paper-2) 20px, transparent 20px), linear-gradient(180deg, transparent 48.5%, color-mix(in srgb, var(--ink-base) 3%, transparent) 49.6%, var(--light) 50%, transparent 51%), var(--sheet); }
        .scheme-e .ticket-content { padding-left: 32px; padding-right: 17px; }
        .scheme-e .ticket-content::before { content: ''; position: absolute; left: 20px; top: 0; bottom: 0; border-left: 1px dashed var(--rule-2); opacity: .55; pointer-events: none; }
        .scheme-e .printline { color: var(--ochre); }
        .scheme-e .identity { border-bottom-style: solid; }
        .scheme-e .name { font-size: 18px; }
        .scheme-e .date { font-size: 9px; }

        /* F 骑缝联票：两侧缺口真实挖空，副联与主票在撕线处轻微错层。 */
        .scheme-f .ticket { --notch: radial-gradient(circle at 0 calc(100% - 43px), transparent 6px, var(--ink-base) 6.5px), radial-gradient(circle at 100% calc(100% - 43px), transparent 6px, var(--ink-base) 6.5px); filter: drop-shadow(0 1px 0 var(--sheet-edge)) drop-shadow(1px 3px 2px var(--shadow)); }
        .scheme-f .surface { border-radius: 2px; border: 0; -webkit-mask-image: var(--notch); mask-image: var(--notch); -webkit-mask-composite: source-in; mask-composite: intersect; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, var(--sheet)) 0 94px, var(--sheet) 94px calc(100% - 43px), color-mix(in srgb, var(--sheet) 96%, var(--rule-2)) calc(100% - 42px), var(--sheet) calc(100% - 37px)); }
        .scheme-f .cast { left: 15px; right: 12px; bottom: -4px; filter: blur(6px); }
        .scheme-f .printline { color: var(--accent); }
        .scheme-f .identity { border-bottom: 0; padding-bottom: 11px; }
        .scheme-f .ticket-foot { margin-inline: -12px; padding: 12px 12px 0; min-height: 27px; }
        .scheme-f .ticket-foot small { letter-spacing: .13em; }

        /* G 胶带手贴：胶带有半透明纤维、切齿与压贴边；纸尾离开桌面。 */
        .scheme-g .ticket { transform: rotate(-.6deg); }
        .scheme-g .ticket:nth-child(even) { transform: rotate(.5deg); }
        .scheme-g .cast { inset: 23% 7px -7px 7px; height: auto; border-radius: 2px 2px 25% 20%; filter: blur(10px); transform: rotate(-1deg); }
        .scheme-g .surface { border: 0; clip-path: polygon(.5% 0, 99.7% .4%, 100% 99%, 96% 99.4%, 90% 99%, 84% 99.8%, 78% 99.2%, 72% 100%, 63% 99.4%, 55% 100%, 48% 99.6%, 40% 99.9%, 32% 99.2%, 25% 100%, 17% 99.3%, 10% 99.8%, 3% 99.1%, 0 99.6%); background: linear-gradient(180deg, color-mix(in srgb, var(--sheet) 96%, var(--ink-base)), var(--sheet) 8% 94%, color-mix(in srgb, var(--sheet) 93%, var(--rule-2))); }
        .scheme-g .tape { display: block; top: -13px; left: calc(50% - 45px); width: 90px; height: 30px; transform: rotate(-4deg); background: repeating-linear-gradient(2deg, transparent 0 2px, color-mix(in srgb, var(--paper-base) 12%, transparent) 2px 3px), color-mix(in srgb, var(--ochre) 22%, transparent); border-block: 1px solid color-mix(in srgb, var(--ochre) 13%, transparent); clip-path: polygon(0 3%, 97% 0, 100% 7%, 98% 19%, 100% 29%, 98% 40%, 100% 52%, 98% 65%, 100% 78%, 98% 89%, 100% 99%, 2% 100%, 0 93%, 2% 80%, 0 68%, 2% 53%, 0 39%, 2% 24%); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--paper-base) 25%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--ochre) 15%, transparent); }
        .scheme-g .tape::after { content: ''; position: absolute; inset: 0; background: var(--ink-base); filter: url('#paper-fibre'); opacity: .08; }
        .scheme-g .ticket-content { padding-top: 22px; }
        .scheme-g .curl { display: block; bottom: 0; left: 9%; right: 8%; height: 4px; border-radius: 0 0 50% 50%; background: linear-gradient(var(--sheet), var(--sheet-edge)); z-index: 1; }
        .scheme-g .printline { margin-bottom: 7px; }

        /* H 卷纸出单：顶部半圆纸卷有独立背面，出纸接缝带细线接触影。 */
        .scheme-h .ticket { padding-top: 1px; }
        .scheme-h .cast { left: 6px; right: 4px; bottom: -5px; height: 80px; border-radius: 50%; filter: blur(9px); }
        .scheme-h .surface { border: 0; border-radius: 0 0 2px 2px; background: linear-gradient(180deg, color-mix(in srgb, var(--sheet) 84%, var(--rule-2)), var(--sheet) 15px 90%, color-mix(in srgb, var(--sheet) 90%, var(--rule-2))); box-shadow: 0 1px 0 var(--sheet-edge); clip-path: polygon(0 0, 100% 0, 100% 99%, 97% 100%, 94% 99%, 91% 100%, 88% 99%, 85% 100%, 82% 99%, 79% 100%, 76% 99%, 73% 100%, 70% 99%, 67% 100%, 64% 99%, 61% 100%, 58% 99%, 55% 100%, 52% 99%, 49% 100%, 46% 99%, 43% 100%, 40% 99%, 37% 100%, 34% 99%, 31% 100%, 28% 99%, 25% 100%, 22% 99%, 19% 100%, 16% 99%, 13% 100%, 10% 99%, 7% 100%, 4% 99%, 0 100%); }
        .scheme-h .hardware { display: block; top: -12px; left: -2px; right: -2px; height: 22px; border: 1px solid var(--sheet-edge); border-radius: 50% / 28%; background: linear-gradient(180deg, var(--sheet-edge), var(--sheet) 28%, var(--light) 44%, var(--sheet) 60%, color-mix(in srgb, var(--sheet) 77%, var(--rule-2)) 95%); box-shadow: 0 2px 2px var(--shadow), inset 0 1px 0 var(--light); }
        .scheme-h .hardware::before { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 15px; border: 1px solid var(--sheet-edge); border-radius: 50%; background: radial-gradient(ellipse at 50% 45%, var(--rule-2) 0 20%, var(--paper-2) 24% 44%, var(--sheet-edge) 48% 58%, var(--sheet) 64%); }
        .scheme-h .ticket-content { padding-top: 22px; }
        .scheme-h .identity { text-align: center; }
        .scheme-h .name { margin: auto; }
        .scheme-h .school { justify-content: center; }
        .scheme-h .profile-arrow { display: none; }

        /* I 点单垫板：承重物有侧厚度，纸仍是薄纸，金属夹把两者连接。 */
        .scheme-i .ticket { height: 398px; padding: 12px 11px 14px; }
        .scheme-i .back { display: block; inset: -5px -1px -3px; border: 1px solid color-mix(in srgb, var(--ochre) 55%, var(--rule-2)); border-radius: 9px; background: repeating-linear-gradient(12deg, transparent 0 3px, color-mix(in srgb, var(--ink-base) 2%, transparent) 3px 4px), linear-gradient(105deg, color-mix(in srgb, var(--ochre) 30%, var(--paper)), color-mix(in srgb, var(--ochre) 20%, var(--paper-2))); box-shadow: inset 1px 1px 0 var(--light), inset -1px -1px 0 var(--shade), 0 3px 0 color-mix(in srgb, var(--ochre) 48%, var(--rule-2)), 0 4px 0 color-mix(in srgb, var(--ochre) 60%, var(--ink-base)), 2px 10px 12px -3px var(--shadow-lg); }
        .scheme-i .surface { inset: 12px 11px 14px; border-radius: 0; box-shadow: 0 1px 0 var(--sheet-edge), 1px 3px 3px var(--shade); }
        .scheme-i .cast { display: none; }
        .scheme-i .ticket-content { padding: 16px 15px 14px; }
        .scheme-i .hardware { display: block; top: -9px; left: calc(50% - 43px); width: 86px; height: 30px; border: 1px solid var(--rule-2); border-radius: 5px 5px 9px 9px; background: linear-gradient(180deg, var(--paper-2), var(--rule-2) 13%, var(--light) 18%, var(--rule) 27% 58%, var(--rule-2) 64%, var(--paper-2) 74%, var(--rule-2) 96%); box-shadow: inset 1px 0 0 var(--light), inset -1px 0 0 var(--shade), 0 2px 1px var(--shade), 0 5px 5px -3px var(--shade); }
        .scheme-i .hardware::before { content: ''; position: absolute; top: -12px; left: 29px; width: 26px; height: 18px; border: 3px solid var(--rule-2); border-radius: 10px 10px 3px 3px; box-shadow: inset 1px 1px 0 var(--light), 1px 0 0 var(--light); }
        .scheme-i .hardware::after { content: ''; position: absolute; left: 9px; right: 9px; bottom: 4px; height: 3px; border-top: 1px solid var(--light); border-bottom: 1px solid var(--shade); border-radius: 50%; }
        .scheme-i .printline { margin-top: 4px; }
        .scheme-i .identity { border-bottom-style: solid; }
        .scheme-i .name { font-size: 18px; }
        .scheme-i .entry { gap: 5px; }
        .scheme-i .date { font-size: 9px; }
        .scheme-i .receipts { padding-top: 44px; }

        .footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--rule-2); margin-top: 29px; padding-top: 20px; font-size: var(--fs-sm); color: var(--muted); }
        #selection { color: var(--accent); }
        .toast { position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%); padding: 10px 18px; border-radius: 4px; z-index: 60; max-width: calc(100vw - 30px); text-align: center; background: var(--popover-bg); color: var(--ink-2); border: 1px solid var(--popover-edge); box-shadow: var(--popover-shadow); font-size: var(--fs-sm); }
        @container preview (max-width: 600px) { .team-board { padding-inline: 12px; } .receipts { grid-auto-columns: min(300px, 94%); gap: 23px; padding-inline: 8px; } }
        @media (max-width: 720px) { .shell { padding: 24px 16px 40px; } h1 { font-size: 24px; } .intro { align-items: start; flex-direction: column; gap: 12px; padding-bottom: 20px; } .controls { position: relative; } .settings-start span { width: 100%; } .settings-end { gap: 7px; } .proposal-head { align-items: start; gap: 12px; } .proposal-title { gap: 8px; } .letter { font-size: 27px; width: 27px; } .proposal h2 { font-size: 16px; } .proposal-head p { font-size: var(--fs-xs); } .pick { padding: 6px 10px; } .board-actions { gap: 9px; } }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }
    </style>
</head>
<body>
    <!-- Icons: Tabler Icons v3.50.0, MIT, https://github.com/tabler/tabler-icons/blob/main/LICENSE -->
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-calendar" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"></path><path d="M16 3v4"></path><path d="M8 3v4"></path><path d="M4 11h16"></path><path d="M11 15h1"></path><path d="M12 15v3"></path></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M17 8v-3a1 1 0 0 0 -1 -1h-10a2 2 0 0 0 0 4h12a1 1 0 0 1 1 1v3m0 4v3a1 1 0 0 1 -1 1h-12a2 2 0 0 1 -2 -2v-12"></path><path d="M20 12v4h-4a2 2 0 0 1 0 -4h4"></path></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"></path><path d="M13.5 6.5l4 4"></path></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><path d="M12 8l0 4l2 2"></path><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13 -8l-13 -8"></path></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path><path d="M12 7v5l3 3"></path></symbol>
<symbol id="i-scan" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M3 7v-2a2 2 0 0 1 2 -2h2"></path><path d="M3 17v2a2 2 0 0 0 2 2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M17 21h2a2 2 0 0 0 2 -2v-2"></path></symbol>
<symbol id="i-tag" viewBox="0 0 24 24"><path d="M6.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path><path d="M3 6v5.172a2 2 0 0 0 .586 1.414l7.71 7.71a2.41 2.41 0 0 0 3.408 0l5.592 -5.592a2.41 2.41 0 0 0 0 -3.408l-7.71 -7.71a2 2 0 0 0 -1.414 -.586h-5.172a3 3 0 0 0 -3 3"></path></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9"></path><path d="M5 21v-7"></path></symbol>
    </svg>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <filter id="paper-fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch" seed="8"/>
                <feColorMatrix type="saturate" values="0"/>
            </filter>
        </defs>
    </svg>
    <main class="shell">
        <header class="intro">
            <div><div class="edition">第二版 · 09 套方案</div><h1>我的队伍 · 小票样式</h1><p>这次重做纸边、弧度和受光，新增三种方案。所有方案使用相同的五个示例角色。</p></div>
            <a class="old-version" href="team-receipt-options.html">对照上一版 ↗</a>
        </header>
        <div class="controls">
            <div class="settings">
                <div class="settings-start"><span>示例数据 · 左右滚动，无滚动条</span><button type="button" class="control" id="all-options" aria-pressed="true">全部对比</button><button type="button" class="control" id="width-toggle" aria-pressed="false">紧凑宽度</button></div>
                <div class="settings-end">
                    <label>主题<select id="theme"><option value="ledger">账簿</option><option value="celadon">青瓷</option><option value="azure">霁蓝</option><option value="crystal">水晶</option><option value="dunhuang">敦煌岩彩</option><option value="rosewood">紫檀书斋</option></select></label>
                    <label>字体<select id="font"><option value="wenkai">文楷</option><option value="rounded">圆体</option><option value="system">系统默认</option></select></label>
                    <button type="button" class="control" id="dark-toggle" aria-pressed="false">暗色</button>
                </div>
            </div>
            <nav class="scheme-nav" aria-label="单独查看方案"></nav>
        </div>
        <div class="recommendation"><span>可以先看：</span><a href="#scheme-A">A · 薄纸小票</a><a href="#scheme-G">G · 胶带贴单</a><a href="#scheme-I">I · 点单垫板</a><span>点击上方字母可单独查看。</span></div>
        <div id="proposals"></div>
        <footer class="footer"><span>可以选整套，也可以组合纸面、固定方式与排版。选定后再改正式页面。</span><span id="selection" role="status" aria-live="polite">尚未选择方案</span></footer>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
        const schemes = [
            { id: 'A', name: '微翘热敏票', desc: '纸尾轻轻翘起，裁口不完全规则。重做薄纸和桌面之间的距离。', details: ['两侧翘影', '不规则撕口', '居中票头'], print: '队伍近况' },
            { id: 'B', name: '弧面奶茶贴签', desc: '贴纸沿杯身微弯，侧面暗、中央亮，右下角露出一小片背胶。', details: ['弧面侧光', '薄胶层', '揭角背面'], print: '角色近况' },
            { id: 'C', name: '金属夹轨出单', desc: '纸从窄夹轨下垂，夹点贴合，下面的阴影逐渐变软。', details: ['拉丝夹片', '纸尾离面', '窄轨固定'], print: '最近记录' },
            { id: 'D', name: '三联复写单', desc: '一张主票、两张底联。用露出的纸边呈现厚度，颜色只留在底纸。', details: ['三层独立纸边', '订针压点', '复写联抬头'], print: '队伍记录 · 第一联' },
            { id: 'E', name: '装订撕页', desc: '左边是撕下来的装订孔，正文沿虚线排齐，纸中间留一道浅折痕。', details: ['穿透装订孔', '侧边撕线', '中部浅折痕'], print: '角色记录' },
            { id: 'F', name: '骑缝联票', desc: '主票与底部副联在撕线处分开受光，两侧缺口直接透出背景。', details: ['真实侧缺口', '主副联分层', '淡色票头'], print: '队伍近况' },
            { id: 'G', name: '胶带手贴单', desc: '半透明胶带压住票头，纸的下半段自然离开桌面。', details: ['半透明纤维胶带', '自然纸尾', '轻微错落'], print: '队伍备忘', added: true },
            { id: 'H', name: '卷纸出单', desc: '顶部保留一小段纸卷，能看到纸芯和圆弧，正文从卷下垂直展开。', details: ['纸卷背面', '出纸接触影', '细密裁齿'], print: '队伍近况', added: true },
            { id: 'I', name: '点单垫板', desc: '硬垫板承担厚度，金属压夹固定薄纸。适合更明显的 3D 方向。', details: ['垫板侧厚度', '金属压夹', '薄纸接触影'], print: '角色记录', added: true },
        ];
        const people = [
            { name: '长安听雨', school: '大唐官府', level: 175, online: '11-19 09:20 · 进行中', duration: '2时36分', active: true, income: ['抓鬼任务', '11-19', '+42.8 万'], accountIn: ['卖出游戏币', '11-18', '+286 元'], accountOut: ['点卡消耗', '11-19', '−8.6 万'] },
            { name: '月落花间', school: '普陀山', level: 175, online: '11-18 19:10–22:45', duration: '3时35分', income: ['副本奖励', '11-18', '+31.6 万'], accountIn: ['物品收入', '11-18', '+68 万'], accountOut: ['买入装备', '11-17', '−120 元'] },
            { name: '一川烟雨', school: '龙宫', level: 159, online: '11-19 09:20 · 进行中', duration: '2时36分', active: true, income: ['师门任务', '11-19', '+18.2 万'], accountIn: ['卖出召唤兽', '11-16', '+380 元'], accountOut: ['点卡消耗', '11-19', '−7.2 万'] },
            { name: '山海有归途', school: '无底洞', level: 129, online: '11-17 20:00–22:20', duration: '2时20分', income: ['周末活动', '11-17', '+26.4 万'], accountIn: ['卖出物品', '11-17', '+45 万'], accountOut: ['学习技能', '11-16', '−32 万'] },
            { name: '新建角色与较长名称示例', school: '未选门派', level: 69, online: null, income: null, accountIn: null, accountOut: null },
        ];
        const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
        const accountRow = (record, expense) => record ? `<div class="entry"><span class="entry-copy" title="${record[0]}"><span class="direction ${expense ? 'out' : ''}">${expense ? '出' : '入'}</span>${record[0]}</span><span class="date">${record[1]}</span><span class="value ${expense ? 'loss' : 'gain'}">${record[2]}</span></div>` : `<p class="empty">暂无${expense ? '支出' : '收入'}</p>`;
        function personMarkup(person, index, scheme) {
            const serial = String(index + 1).padStart(2, '0');
            return `<article class="ticket" aria-label="${person.name}的最近记录">
                <span class="cast" aria-hidden="true"></span><span class="back" aria-hidden="true"></span><span class="surface" aria-hidden="true"></span>
                <div class="ticket-content">
                    <div class="printline"><span>${scheme.print}</span><span class="print-number">No. ${serial}</span></div>
                    <header class="identity"><div class="identity-copy"><button type="button" class="name" data-profile="${person.name}" title="${person.name}">${person.name}</button><p class="school"><span>${person.school}</span><span class="level">${person.level} 级</span></p></div><span class="profile-arrow" aria-hidden="true">›</span></header>
                    <div class="records">
                        <section class="record"><h4>${icon('history')}最近上线</h4>${person.online ? `<div class="entry"><span class="entry-copy" title="${person.online}">${person.online}</span><span class="value">${person.duration}</span></div>` : '<p class="empty">暂无上线记录</p>'}</section>
                        <section class="record"><h4>${icon('wallet')}最近收益</h4>${person.income ? `<div class="entry"><span class="entry-copy" title="${person.income[0]}">${person.income[0]}</span><span class="date">${person.income[1]}</span><span class="value gain">${person.income[2]}</span></div>` : '<p class="empty">暂无收益记录</p>'}</section>
                        <section class="record"><h4>${icon('tag')}账号收支</h4>${accountRow(person.accountIn, false)}${accountRow(person.accountOut, true)}</section>
                    </div>
                    <div class="ticket-foot"><span class="state ${person.active ? 'online' : ''}">${person.active ? '在线中' : '最近记录'}</span><small>梦幻助手</small></div>
                </div>
                <span class="hardware" aria-hidden="true"></span><span class="tape" aria-hidden="true"></span><span class="curl" aria-hidden="true"></span>
            </article>`;
        }
        document.querySelector('.scheme-nav').innerHTML = schemes.map(s => `<button type="button" data-view="${s.id}" aria-pressed="false"><b>${s.id}</b>${s.name}</button>`).join('');
        document.querySelector('#proposals').innerHTML = schemes.map(s => `<section class="proposal" id="scheme-${s.id}" aria-labelledby="title-${s.id}">
            <header class="proposal-head"><div class="proposal-title"><span class="letter">${s.id}</span><div><h2 id="title-${s.id}">${s.name}${s.added ? '<span class="new-label">新增</span>' : ''}</h2><p>${s.desc}</p></div></div><button type="button" class="pick" data-pick="${s.id}" aria-pressed="false">选这套</button></header>
            <div class="preview scheme-${s.id.toLowerCase()}"><section class="board team-board">
                <header class="board-head"><div class="board-title"><i class="section-mark" aria-hidden="true"></i><h3>我的队伍</h3></div><div class="board-actions"><button type="button" class="text-button" data-demo="新增角色">新增</button><button type="button" class="text-button" data-demo="管理角色">管理</button><div class="arrows"><button type="button" class="arrow" data-scroll="-1" aria-label="向左查看角色">‹</button><button type="button" class="arrow" data-scroll="1" aria-label="向右查看角色">›</button></div></div></header>
                <div class="receipts" tabindex="0" aria-label="${s.name}，角色列表，左右滚动查看">${people.map((person, index) => personMarkup(person, index, s)).join('')}</div>
            </section></div><p class="detail-note">${s.details.map(detail => `<span>${detail}</span>`).join('')}</p>
        </section>`).join('');
        let toastTimer;
        const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
        function showToast(message) {
            const toast = document.querySelector('#toast');
            toast.textContent = message;
            toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
        }
        function viewScheme(id) {
            document.querySelectorAll('.proposal').forEach(section => { section.hidden = Boolean(id) && section.id !== `scheme-${id}`; });
            document.querySelectorAll('[data-view]').forEach(button => { button.setAttribute('aria-pressed', String(button.dataset.view === id)); });
            document.querySelector('#all-options').setAttribute('aria-pressed', String(!id));
        }
        document.addEventListener('click', event => {
            const scroll = event.target.closest('[data-scroll]');
            if (scroll) {
                const strip = scroll.closest('.team-board').querySelector('.receipts');
                const ticket = strip.querySelector('.ticket');
                strip.scrollBy({ left: Number(scroll.dataset.scroll) * (ticket.getBoundingClientRect().width + Number.parseFloat(getComputedStyle(strip).columnGap)), behavior: reducedMotion() ? 'instant' : 'smooth' });
            }
            const view = event.target.closest('[data-view]');
            if (view) { viewScheme(view.dataset.view); document.querySelector(`#scheme-${view.dataset.view}`).scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'instant' : 'smooth' }); }
            const jump = event.target.closest('.recommendation a');
            if (jump) viewScheme('');
            const pick = event.target.closest('[data-pick]');
            if (pick) {
                document.querySelectorAll('[data-pick]').forEach(button => { button.setAttribute('aria-pressed', String(button === pick)); });
                const scheme = schemes.find(item => item.id === pick.dataset.pick);
                document.querySelector('#selection').textContent = `已选 ${scheme.id} · ${scheme.name}`;
                showToast(`选中 ${scheme.id} · ${scheme.name}，把字母告诉我即可`);
            }
            const profile = event.target.closest('[data-profile]');
            if (profile) showToast(`${profile.dataset.profile} · 示例角色`);
            const demo = event.target.closest('[data-demo]');
            if (demo) showToast(`${demo.dataset.demo} · 示例入口`);
        });
        document.querySelector('#all-options').addEventListener('click', () => viewScheme(''));
        document.querySelector('#width-toggle').addEventListener('click', event => { const compact = document.body.classList.toggle('compact'); event.currentTarget.setAttribute('aria-pressed', String(compact)); event.currentTarget.textContent = compact ? '恢复宽度' : '紧凑宽度'; });
        document.querySelector('#theme').addEventListener('change', event => { document.documentElement.dataset.style = event.target.value; });
        document.querySelector('#font').addEventListener('change', event => { document.documentElement.dataset.font = event.target.value; });
        document.querySelector('#dark-toggle').addEventListener('click', event => { const dark = document.documentElement.classList.toggle('dark'); event.currentTarget.setAttribute('aria-pressed', String(dark)); event.currentTarget.textContent = dark ? '亮色' : '暗色'; });
    </script>
</body>
</html>
