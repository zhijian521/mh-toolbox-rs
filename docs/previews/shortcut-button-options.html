<!doctype html>
<html lang="zh-CN" data-style="ledger" data-font="wenkai">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>常用功能 · 六套按钮方案</title>
        <link rel="stylesheet" href="../../src/styles/tokens.css" />
        <link rel="stylesheet" href="../../src/styles/base.css" />
        <style>
            /* 方案只定义造型与布局，主题、字体和进度材质均引用项目入口。 */
            html {
                scroll-behavior: smooth;
                scroll-padding-top: 140px;
            }
            body {
                height: auto;
                min-height: 100vh;
            }
            button {
                font: inherit;
                color: inherit;
                cursor: pointer;
            }
            button:focus-visible,
            a:focus-visible,
            select:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 4px;
            }
            [hidden] {
                display: none !important;
            }
            .sprite {
                position: absolute;
                width: 0;
                height: 0;
                overflow: hidden;
            }
            .icon {
                width: 23px;
                height: 23px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.65;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none;
            }
            .shell {
                max-width: 1280px;
                padding: 38px 36px 72px;
                margin: auto;
            }
            .intro {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 24px;
                margin-bottom: 28px;
            }
            .kicker {
                color: var(--accent);
                letter-spacing: 0.15em;
                font-size: var(--fs-xs);
                margin-bottom: 10px;
            }
            h1 {
                font-size: 30px;
                line-height: 1.4;
            }
            .intro p {
                color: var(--muted);
                font-size: var(--fs-sm);
                margin-top: 9px;
            }
            .edition {
                color: var(--muted);
                font-size: var(--fs-xs);
                white-space: nowrap;
                padding-bottom: 5px;
            }
            .toolbar {
                position: sticky;
                top: 0;
                z-index: 10;
                background: var(--bg);
                border-block: 1px solid var(--rule);
                padding: 12px 0;
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px 22px;
            }
            .toolbar label {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--muted);
                font-size: var(--fs-xs);
            }
            .control,
            select {
                min-height: 34px;
                padding: 5px 12px;
                border: 1px solid var(--rule);
                border-radius: var(--r-ticket);
                background: var(--paper);
                color: var(--ink-2);
                font-size: var(--fs-sm);
            }
            .control:hover {
                border-color: var(--rule-2);
            }
            .control[aria-pressed='true'] {
                color: var(--accent);
                border-color: var(--accent);
            }
            .toolbar .spacer {
                flex: 1;
            }
            .jump {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-block: 16px 10px;
            }
            .jump a {
                padding: 7px 12px;
                color: var(--ink-2);
                font-size: var(--fs-sm);
                border-radius: var(--r-ticket);
            }
            .jump a:hover {
                background: var(--paper-2);
            }
            .jump b {
                color: var(--accent);
                margin-right: 6px;
                font-weight: 400;
            }
            .proposal {
                margin-top: 30px;
            }
            .proposal-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 13px;
            }
            .proposal-name {
                display: flex;
                align-items: center;
                gap: 13px;
            }
            .letter {
                color: var(--accent);
                font-size: 28px;
                line-height: 1;
            }
            .proposal h2 {
                font-size: var(--fs-lg);
            }
            .proposal-head p {
                color: var(--muted);
                font-size: var(--fs-xs);
                margin-top: 4px;
            }
            .pick {
                flex: none;
            }
            .scene {
                display: grid;
                grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
                align-items: stretch;
                gap: 16px;
            }
            .scene .board {
                background-image: none;
                padding: 18px;
            }
            .section-title {
                display: flex;
                align-items: center;
                gap: 9px;
                margin-bottom: 21px;
            }
            .section-title h3 {
                font-size: var(--fs-md);
            }
            .section-title .minor {
                margin-left: auto;
                color: var(--muted);
                font-size: var(--fs-xs);
            }
            .section-mark {
                width: 3px;
                height: 15px;
                border-radius: 1px;
                background: var(--accent);
            }
            .buttons {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 14px 12px;
                align-content: start;
            }
            .shortcut {
                --tone: var(--indigo-ink);
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 62px;
                gap: 10px;
                border: 0;
                padding: 12px 9px;
                border-radius: 6px;
                background: var(--paper);
                color: var(--ink-2);
                font-size: var(--fs-base);
                transition:
                    background-color var(--t-quick),
                    border-color var(--t-quick),
                    box-shadow var(--t-quick),
                    color var(--t-quick);
            }
            .shortcut .icon {
                color: var(--tone);
            }
            .shortcut .label {
                white-space: nowrap;
            }
            .shortcut[data-tone='moss'] {
                --tone: var(--moss);
            }
            .shortcut[data-tone='accent'] {
                --tone: var(--accent);
            }
            .shortcut[data-tone='ochre'] {
                --tone: var(--ochre);
            }
            .shortcut:hover {
                color: var(--ink);
            }
            /* A：细薄瓷边，只留一阶接触影，图文共用一张干净的正面。 */
            .buttons-a .shortcut {
                border: 1px solid color-mix(in srgb, var(--rule-2) 65%, var(--paper));
                background: color-mix(in srgb, var(--paper) 96%, var(--tone));
                box-shadow:
                    inset 0 1px 0 var(--bevel-hi),
                    inset 1px 0 0 var(--bevel-hi),
                    0 2px 0 var(--rule),
                    0 5px 6px -4px var(--shadow-lg);
            }
            .buttons-a .shortcut:hover {
                border-color: var(--tone);
                background: var(--paper);
            }
            .buttons-a .shortcut:active {
                background: var(--well);
                box-shadow:
                    inset 0 1px 3px var(--shadow),
                    0 1px 0 var(--bevel-hi);
            }
            /* B：深底座、收口正面与独立键帽，图标在上，名称在下。 */
            .buttons-b {
                gap: 16px 13px;
                padding: 3px 2px 7px;
            }
            .buttons-b .shortcut {
                flex-direction: column;
                gap: 10px;
                min-height: 88px;
                border: 1px solid var(--rule-2);
                border-radius: 9px;
                background: linear-gradient(180deg, var(--paper), var(--paper-2));
                box-shadow:
                    inset 0 1px 0 var(--bevel-hi),
                    inset 3px 0 0 color-mix(in srgb, var(--bevel-hi) 50%, transparent),
                    inset -3px 0 0 var(--bevel-lo),
                    0 5px 0 var(--rule-2),
                    0 6px 0 var(--bevel-lo),
                    0 9px 7px -4px var(--shadow-lg);
            }
            .buttons-b .shortcut::after {
                content: '';
                width: 18px;
                height: 2px;
                border-radius: 2px;
                background: color-mix(in srgb, var(--tone) 35%, var(--paper));
            }
            .buttons-b .shortcut:hover {
                border-color: var(--tone);
            }
            .buttons-b .shortcut:active {
                background: var(--well);
                box-shadow:
                    inset 0 2px 5px var(--shadow-lg),
                    0 2px 0 var(--rule-2),
                    0 4px 4px -2px var(--shadow);
            }
            /* C：立体集中在圆形图标，文字直接落在外卡上。 */
            .buttons-c {
                gap: 19px 10px;
            }
            .buttons-c .shortcut {
                flex-direction: column;
                gap: 12px;
                background: transparent;
                padding: 0 5px 4px;
            }
            .round-seat {
                display: grid;
                place-items: center;
                width: 49px;
                height: 49px;
                border-radius: 50%;
                border: 1px solid var(--rule-2);
                background: radial-gradient(circle at 35% 25%, var(--paper), var(--paper-2));
                box-shadow:
                    inset 0 1px 0 var(--bevel-hi),
                    inset 0 -2px 0 var(--bevel-lo),
                    0 3px 0 var(--rule),
                    0 6px 7px -3px var(--shadow-lg);
            }
            .buttons-c .shortcut:hover .round-seat {
                border-color: var(--tone);
                background: var(--paper);
            }
            .buttons-c .shortcut:active .round-seat {
                background: var(--well);
                box-shadow:
                    inset 0 2px 3px var(--shadow-lg),
                    0 1px 0 var(--bevel-hi);
            }
            /* D：侧边短签承担颜色，偏斜底边只画在阴影里，按钮不位移。 */
            .buttons-d {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px 16px;
            }
            .buttons-d .shortcut {
                justify-content: flex-start;
                min-height: 57px;
                padding-inline: 19px 14px;
                gap: 12px;
                border: 1px solid var(--rule);
                border-radius: var(--r-ticket);
                box-shadow:
                    2px 2px 0 var(--rule),
                    3px 5px 5px -4px var(--shadow-lg);
            }
            .buttons-d .shortcut::before {
                content: '';
                position: absolute;
                left: -1px;
                top: 13px;
                bottom: 13px;
                width: 3px;
                border-radius: 2px;
                background: var(--tone);
            }
            .buttons-d .shortcut::after {
                content: '›';
                margin-left: auto;
                color: var(--muted);
                font-size: var(--fs-md);
            }
            .buttons-d .shortcut:hover {
                border-color: var(--tone);
                background: color-mix(in srgb, var(--tone) 4%, var(--paper));
            }
            .buttons-d .shortcut:active {
                background: var(--well);
                box-shadow: inset 1px 1px 3px var(--shadow);
            }
            /* E：联排琴键只用一个连续底座，减少逐个小卡片的包围感。 */
            .buttons-e {
                gap: 0;
                border: 1px solid var(--rule-2);
                border-radius: 6px;
                overflow: hidden;
                box-shadow:
                    0 3px 0 var(--rule),
                    0 6px 7px -4px var(--shadow-lg);
            }
            .buttons-e .shortcut {
                flex-direction: column;
                min-height: 91px;
                gap: 13px;
                border-radius: 0;
                box-shadow:
                    inset 1px 0 0 var(--bevel-hi),
                    inset -1px 0 0 var(--rule),
                    inset 0 1px 0 var(--bevel-hi),
                    inset 0 -1px 0 var(--rule);
                background: linear-gradient(
                    180deg,
                    var(--paper),
                    color-mix(in srgb, var(--paper-2) 60%, var(--paper))
                );
            }
            .buttons-e .shortcut::before {
                content: '';
                position: absolute;
                width: 19px;
                height: 2px;
                top: 0;
                background: color-mix(in srgb, var(--tone) 40%, var(--paper));
            }
            .buttons-e .shortcut:hover {
                background: var(--paper);
                color: var(--tone);
            }
            .buttons-e .shortcut:active {
                background: var(--well);
                box-shadow:
                    inset 0 2px 5px var(--shadow),
                    inset -1px 0 0 var(--rule);
            }
            /* F：薄纸签与压印图标，虚线放在侧边，呼应已有小票但不重复拉手。 */
            .buttons-f {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 13px 16px;
            }
            .buttons-f .shortcut {
                justify-content: flex-start;
                min-height: 58px;
                gap: 13px;
                padding-inline: 16px;
                border: 1px solid var(--rule);
                border-radius: var(--r-ticket);
                background: var(--paper);
                box-shadow:
                    inset 0 1px 0 var(--bevel-hi),
                    0 1px 1px var(--shadow),
                    0 5px 5px -4px var(--shadow-lg);
            }
            .buttons-f .shortcut .icon {
                box-sizing: content-box;
                padding-right: 13px;
                border-right: 1px dashed var(--rule-2);
                filter: drop-shadow(0 1px 0 var(--bevel-hi));
            }
            .buttons-f .shortcut::after {
                content: '';
                position: absolute;
                top: 5px;
                bottom: 5px;
                right: 4px;
                width: 2px;
                border-right: 1px dotted var(--rule);
            }
            .buttons-f .shortcut:hover {
                border-color: var(--tone);
                background: color-mix(in srgb, var(--paper) 96%, var(--tone));
            }
            .buttons-f .shortcut:active {
                background: var(--well);
                box-shadow: inset 0 1px 3px var(--shadow);
            }
            .goal {
                padding: 12px 0 17px;
            }
            .goal + .goal {
                border-top: 1px solid var(--rule);
            }
            .goal:first-of-type {
                padding-top: 0;
            }
            .goal-top {
                display: flex;
                align-items: baseline;
                gap: 10px;
                justify-content: space-between;
            }
            .goal-top h4 {
                font-size: var(--fs-sm);
            }
            .goal-top b {
                color: var(--num);
                font-size: var(--fs-xs);
                font-weight: 400;
                font-variant-numeric: tabular-nums;
            }
            .goal p {
                color: var(--muted);
                font-size: var(--fs-mini);
                margin: 6px 0 11px;
            }
            .goal-progress {
                display: grid;
                grid-template-columns: repeat(10, minmax(0, 1fr));
                gap: 2px;
            }
            .tick {
                height: calc(7px * var(--fs-scale));
                overflow: hidden;
                border-radius: 1px;
                background: var(--well);
                box-shadow:
                    inset 0 1px 1px var(--shadow-lg),
                    0 1px 0 var(--bevel-hi);
            }
            .tick i {
                display: block;
                height: 100%;
                border-radius: inherit;
                background: var(--progress-tick-fill);
                box-shadow:
                    inset 0 1px 0 var(--bevel-hi),
                    inset 0 -1px 0 var(--bevel-lo);
            }
            .scene-note {
                margin-top: 13px;
                color: var(--muted);
                font-size: var(--fs-xs);
            }
            .footer {
                margin-top: 38px;
                padding-top: 17px;
                border-top: 1px solid var(--rule);
                display: flex;
                justify-content: space-between;
                gap: 20px;
                font-size: var(--fs-sm);
                color: var(--muted);
            }
            #selection {
                color: var(--accent);
            }
            .compact .scene {
                max-width: 840px;
            }
            .compact .buttons {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .compact .buttons-e .shortcut {
                min-height: 74px;
            }
            @media (max-width: 1000px) {
                .buttons {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }
            @media (max-width: 700px) {
                .shell {
                    padding: 24px 18px 50px;
                }
                .intro {
                    align-items: start;
                }
                .edition {
                    display: none;
                }
                .scene {
                    grid-template-columns: minmax(0, 1fr);
                }
                .proposal-head {
                    align-items: start;
                }
                .proposal-head p {
                    max-width: 30em;
                }
                .footer {
                    flex-direction: column;
                    gap: 9px;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                html {
                    scroll-behavior: auto;
                }
            }
        </style>
    </head>
    <body>

        <main class="shell">
            <header class="intro">
                <div>
                    <div class="kicker">梦幻助手 / 常用功能</div>
                    <h1>换一种按钮手感。</h1>
                    <p>六套新方案，放在纯色卡片里对比。悬停保持原位，点击可感受按压反馈。</p>
                </div>
                <span class="edition">按钮提案 · 02</span>
            </header>
            <div class="toolbar" aria-label="预览设置">
                <label
                    >查看
                    <select id="scheme">
                        <option value="all">全部方案</option>
                    </select></label
                >
                <button type="button" id="compact" class="control" aria-pressed="false">
                    紧凑宽度
                </button>
                <span class="spacer"></span>
                <label
                    >主题
                    <select id="theme">
                        <option value="ledger">账簿</option>
                        <option value="celadon">青瓷</option>
                        <option value="azure">霁蓝</option>
                        <option value="crystal">水晶</option>
                        <option value="dunhuang">敦煌岩彩</option>
                        <option value="rosewood">紫檀书斋</option>
                    </select></label
                >
                <label
                    >字体
                    <select id="font">
                        <option value="wenkai">文楷</option>
                        <option value="rounded">圆体</option>
                        <option value="system">系统默认</option>
                    </select></label
                >
                <button type="button" id="dark" class="control" aria-pressed="false">暗色</button>
            </div>
            <nav class="jump" aria-label="方案导航"></nav>
            <div id="gallery"></div>
            <footer class="footer">
                <span>看好后告诉我字母，正式首页再应用。</span
                ><span id="selection" role="status" aria-live="polite">尚未选择</span>
            </footer>
        </main>
        <script>
            const proposals = [
                {
                    id: 'A',
                    name: '薄瓷轻键',
                    description: '横排图文、薄瓷边和短投影，整体最清爽。',
                    note: '厚度较轻，适合与现有票据、图表搭配。',
                },
                {
                    id: 'B',
                    name: '机械键帽',
                    description: '图标在上、名称在下，立体底座与按压感最明确。',
                    note: '单键更饱满，适合希望保留明显 3D 效果的方向。',
                },
                {
                    id: 'C',
                    name: '圆钮图标',
                    description: '只让图标凸起，文字直接放在纸面上。',
                    note: '没有整块按钮外框，减轻卡片里再套卡片的感觉。',
                },
                {
                    id: 'D',
                    name: '侧签短键',
                    description: '两列横排、左侧色签，操作更像一组清楚的入口。',
                    note: '造型方正，信息最容易扫读，右侧箭头提示可进入。',
                },
                {
                    id: 'E',
                    name: '联排琴键',
                    description: '多个入口共用一块连续底座，按键之间只留接缝。',
                    note: '减少零散小卡片，用一整组键盘组织常用操作。',
                },
                {
                    id: 'F',
                    name: '纸签压印',
                    description: '薄纸边缘、侧边虚线与轻压印图标，呼应小票。',
                    note: '纸感更强、阴影更柔，避免重复之前的弧形拉手。',
                },
            ];
            const shortcuts = [
                ['记一笔', 'wallet', 'accent'],
                ['添加物价', 'tag', 'ochre'],
                ['捉鬼助手', 'scan', 'moss'],
                ['闹钟', 'clock', 'indigo'],
                ['物品速记', 'pencil', 'accent'],
                ['新增目标', 'flag', 'moss'],
                ['活动日历', 'calendar', 'ochre'],
                ['在线记录', 'history', 'indigo'],
            ];
            const goals = [
                ['师门技能提升', 25, '养成 · 2 个角色'],
                ['装备储备金', 60, '存钱 · 1 个角色'],
                ['队伍综合养成', 88, '组合 · 12 / 16 项达标'],
            ];
            const icon = (name) =>
                `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
            const progress = (value) =>
                `<div class="goal-progress progress-adaptive" style="--progress-ratio:${value}%" role="progressbar" aria-label="示例目标进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}">${Array.from({ length: 10 }, (_, i) => `<span class="tick" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, (value - i * 10) * 10))}%"></i></span>`).join('')}</div>`;
            document.querySelector('.jump').innerHTML = proposals
                .map((p) => `<a href="#proposal-${p.id}"><b>${p.id}</b>${p.name}</a>`)
                .join('');
            document
                .querySelector('#scheme')
                .insertAdjacentHTML(
                    'beforeend',
                    proposals
                        .map((p) => `<option value="${p.id}">${p.id} · ${p.name}</option>`)
                        .join(''),
                );
            document.querySelector('#gallery').innerHTML = proposals
                .map(
                    (p) => `
            <section class="proposal" id="proposal-${p.id}" aria-labelledby="title-${p.id}">
                <header class="proposal-head"><div class="proposal-name"><span class="letter">${p.id}</span><div><h2 id="title-${p.id}">${p.name}</h2><p>${p.description}</p></div></div><button type="button" class="control pick" data-pick="${p.id}" aria-pressed="false">选这套</button></header>
                <div class="scene">
                    <section class="board" aria-label="${p.name}常用功能预览"><div class="section-title"><i class="section-mark" aria-hidden="true"></i><h3>常用功能</h3><span class="minor">自定义</span></div><div class="buttons buttons-${p.id.toLowerCase()}">${shortcuts.map(([label, name, tone]) => `<button type="button" class="shortcut" data-tone="${tone}" aria-label="${label}，仅演示按钮效果">${p.id === 'C' ? `<span class="round-seat">${icon(name)}</span>` : icon(name)}<span class="label">${label}</span></button>`).join('')}</div></section>
                    <section class="board" aria-label="目标进度配色预览"><div class="section-title"><i class="section-mark" aria-hidden="true"></i><h3>目标</h3><span class="minor">全部</span></div>${goals.map(([name, value, meta]) => `<article class="goal"><div class="goal-top"><h4>${name}</h4><b>${value}%</b></div><p>${meta}</p>${progress(value)}</article>`).join('')}</section>
                </div><p class="scene-note">${p.note}</p>
            </section>`,
                )
                .join('');
            document.querySelector('#theme').addEventListener('change', (event) => {
                document.documentElement.dataset.style = event.target.value;
            });
            document.querySelector('#font').addEventListener('change', (event) => {
                document.documentElement.dataset.font = event.target.value;
            });
            document.querySelector('#dark').addEventListener('click', (event) => {
                const active = document.documentElement.classList.toggle('dark');
                event.currentTarget.setAttribute('aria-pressed', String(active));
            });
            document.querySelector('#compact').addEventListener('click', (event) => {
                const active = document.body.classList.toggle('compact');
                event.currentTarget.setAttribute('aria-pressed', String(active));
            });
            document.querySelector('#scheme').addEventListener('change', (event) => {
                document.querySelectorAll('.proposal').forEach((section) => {
                    section.hidden =
                        event.target.value !== 'all' &&
                        section.id !== `proposal-${event.target.value}`;
                });
            });
            document.querySelectorAll('[data-pick]').forEach((button) =>
                button.addEventListener('click', () => {
                    document.querySelectorAll('[data-pick]').forEach((other) => {
                        other.setAttribute('aria-pressed', String(other === button));
                    });
                    const choice = proposals.find((p) => p.id === button.dataset.pick);
                    document.querySelector('#selection').textContent =
                        `已选 ${choice.id} · ${choice.name}（仅在当前预览记下）`;
                }),
            );
        </script>
    </body>
</html>
