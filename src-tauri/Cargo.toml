[package]
name = "mh-toolbox-rs"
version = "0.1.0"
description = "梦幻养老助手 Rust 版"
edition = "2021"
# 取依赖树里最高的那个：锁定的 `tauri 2.12.5` 自己写着 1.90（`windows` 是 1.82）。
# 这里写低了不会「更兼容」，只会让 1.77~1.89 的机器在编依赖时报一堆第三方 crate 的
# 语法错，而不是本仓能读懂的一句「需要 1.90」。真正要改的时机是换 tauri 版本。
rust-version = "1.90"

[lib]
name = "mh_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# 导入导出要系统「另存为 / 打开」对话框。**只在 Rust 侧用 `app.dialog()`**，
# 不引 npm 包、不开 capability：前端仍然只经 `invoke` 说话，`services/` 边界不动。
# （capability 管的是「前端能不能直接调插件的 JS 命令」，本仓前端一行都不调。）
#
# 代价不止这一个 crate：它会带进 `tauri-plugin-fs`（硬依赖，`FilePath` 就来自那里）、
# `rfd 0.17`（真正弹窗的那个）、以及 `notify`（`Cargo.lock` 里原先一条都没有）。
# **首次全量编译约 +1 分钟**，之后增量不受影响——别把这段时间当成「哪里配错了」去找。
#
# `rfd 0.17` 与 `tauri-plugin-fs` 的源码已经用了 let-chain，**要 rustc ≥ 1.88**；
# 文件头的 `rust-version = "1.90"` 正好够。这是「别把 MSRV 调低」的又一条具体理由，
# 比那边「第三方 crate 报语法错」更直接：调低了，报错会出现在这两个依赖的内部文件里。
tauri-plugin-dialog = "2"
# 没有直接依赖 serde_json：IPC 的序列化由 tauri 自己做，Rust 侧从不手写 JSON。
# 需要读 `public/maps/maps.json` 的是前端（`ghost-maps.ts` 走 fetch），不是这里。

# PaddleOCR（PP-OCRv4）离线识别：检测 + 方向分类 + 识别三个 ONNX 模型。
#
# 为什么换掉 `Windows.Media.Ocr`：那个引擎对**彩色描边大字**几乎必错。
# 2026-11-01 用三张真机截图量过：同一帧里白字全对，而黄色高亮的「金钱镖」
# 「金童子」「龙女妹妹」整段读不出来，且不返回置信度，错了也不知道。
# PP-OCRv4 是中文专门训练的，且分「检测 → 识别」两步，先框出文本行再认，
# 对暗底亮字、半透明面板、彩色字都稳得多。
#
# 代价：模型 16MB 随包分发，onnxruntime 约 12MB。换来的是识别率，
# 而这一页的全部价值就是「认得准」。
paddle-ocr-rs = "0.6"

# 把 ort 钉死在 rc.10：`paddle-ocr-rs` 的 Cargo.toml 只写 `2.0.0-rc.10`，
# 而预发布版本号在 caret 语义下会一路爬到 rc.15——rc.13 之后 `inputs!` 宏
# 的返回值从 `Result` 变成裸 `Vec`，第三方 crate 里 15 处 `?` 全部编译失败。
# 这类漂移只有在真正编译时才会暴露，写死在依赖里比等上游发版可靠。
ort = "=2.0.0-rc.10"

# `RgbImage` 只在构造 OCR 输入时用，编码器一个都不需要。
image = { version = "0.25", default-features = false }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"

# 截屏 + 离线 OCR。只用系统自带能力，不引入 onnxruntime / 模型文件。
#
# 为什么不用 `windows-sys`：WinRT 那一族（`Windows.Media.Ocr`）在 `windows-sys` 里
# 只有裸 vtable，调一次要手写百来行；`windows` 已经把 `OcrEngine` 包成方法。
# 代价是编译慢一些（独立 profile 下约 +40s），只影响首次构建。
#
# feature 清单按「用到才开」列，不做通配：`windows` 开一个 Win32 分区会拖进上千个
# 常量与函数签名，全开能让 rlib 从 3MB 涨到 40MB。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# 本地数据层：物价、角色名册这些「用户自己攒出来的东西」落在 SQLite 一个文件里。
#
# **`bundled` 不能省**：它把 sqlite3 的 Amalgamation 一起编进可执行文件。
# 不带的默认行为是去系统里找 `sqlite3.dll`——Windows 不自带，用户装完打不开，
# 而这是个「双击就能用」的桌面小工具，不该让人先配 DLL。
#
# 代价是首次编译多约 20–30s（sqlite3 单文件约 25MB 源码），之后增量不受影响。
rusqlite = { version = "0.32", features = ["bundled"] }

# 原先不直接依赖 `serde_json`（IPC 的序列化由 tauri 自己做，Rust 侧从不手写 JSON）。
# 角色名册落地后需要了：`CharacterData` 嵌套很深且结构还在演进，用一列 JSON 文本
# 存整条记录比拆十几张表耐改。物价的 `price_items` / `price_points` 仍是规范化表，
# 因为那里要按 `updated_at` 排序、按 `item_id` 查历史——**有没有按字段查询的需求**
# 是这两种存法的分界，不是省事与否。
serde_json = "1"

# 发布版把前端产物**嵌进可执行文件**，开发版才去连 devUrl。
#
# 这一块不能省。Tauri 的机制是：`tauri dev` 带 `--no-default-features` 编译
# （日志里能看见），把下面的默认 feature 关掉 → 走 `devUrl`；`tauri build`
# 用默认 feature → 走内嵌资源。没有 `[features]` 时 `--no-default-features`
# 是空操作，两种构建编出来的二进制**一模一样**，`tauri build` 的产物仍然去连
# `http://127.0.0.1:5173`——装到没起 dev server 的机器上就是白屏。
# 2026-11-01 实测：release 包起来后 `location.href` 就是 devUrl，不是 `tauri://localhost`。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# dev 构建不生成调试信息：本机 rustc 在并行编译时出现过 STATUS_ACCESS_VIOLATION，
# 关掉 debuginfo 既减少内存峰值也快得多；真要调试时用 `RUSTFLAGS=-g` 单独开。
[profile.dev]
debug = 0
incremental = true

# 与最终产物一致的体积口径：strip 符号 + LTO + 单编译单元 + 体积优先。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
