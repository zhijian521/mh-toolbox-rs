# 云端质量门覆盖前端、Rust 格式和后端测试；系统 OCR 与真游戏场景在本机验收。

name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # 与首版已成功构建的工具链一致，避免 ort-sys rc.10 的 DLL 复制假设被新 Cargo 布局打破。
  RUSTUP_TOOLCHAIN: 1.99.1

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端质量门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `lint:commits` 读最近 20 条提交信息，浅克隆（默认 depth 1）只剩一条，
          # 校验器等于没跑。20 条够它看到习惯，也不至于拉整段历史。
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust 格式
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt
      # Linux 只检查格式；后端编译、测试与本机 Clippy 使用 Windows + MSVC。
      - run: cargo fmt --check

  rust-test:
    # Win32 / WinRT 代码需要 Windows；存储、备份与图像逻辑保持自动检查。
    name: Rust 测试
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      # tauri 的依赖树编译很慢，缓存尽量让这条 job 别每次都重编一遍。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 默认 custom-protocol 会把 dist/ 嵌入程序，干净检出必须先构建前端。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # 这两步要在仓库根跑（job 默认工作目录是 src-tauri），所以单独覆盖。
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      # 托管镜像不保证系统中文 OCR 引擎可用，仅排除此项环境测试。
      # 本机 cargo test --lib 仍执行它；不忽略其他测试失败。
      - name: 后端测试（系统 OCR 环境测试留给本机）
        run: cargo test --locked --lib -- --skip ocr::tests::pipeline_runs_on_a_synthetic_frame
      - name: 记录验证范围
        if: always()
        shell: pwsh
        run: |
          @'
          ### 后端验证范围
          - 系统中文 OCR 环境测试 `ocr::tests::pipeline_runs_on_a_synthetic_frame` 不在云端运行，本机全量测试仍执行。
          - 依赖前台游戏窗口的实验测试沿用源码中的 ignore 标记。
          - 本任务结果不代表已验收离线 OCR 模型、真实游戏截图或安装升级，发布前仍须本机验收。
          '@ >> $env:GITHUB_STEP_SUMMARY
