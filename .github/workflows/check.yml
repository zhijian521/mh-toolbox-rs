# 质量门。人跑的和这里跑的是同一条命令，这是 CONVENTIONS §2.1 的约定，
# 所以这个文件只有一步：`npm run check`。
#
# 为什么要它：`npm run check` 一直只在本机跑。规范与代码脱钩过一次——
# `lint:commits` 的正则要求冒号后带空格，而 8 条提交是紧贴写的，
# 因为没人在 CI 里跑，谁都不知道它是红的。

name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    name: 前端质量门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `lint:commits` 读最近 20 条提交信息，浅克隆（默认 depth 1）只剩一条，
          # 校验器等于没跑。20 条够它看到习惯，也不至于拉整段历史。
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust 格式
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 只查格式。`cargo clippy` 在 Linux 上要先装 webkit2gtk 等一整套系统库才编得动
      # （见 AGENTS.md §三），而这条链路本来就在 Windows + MSVC 下验证的。
      # 等真有人用 CI 做发布，再把 clippy 与打包一起接上。
      - run: cargo fmt --check

  rust-test:
    # 截屏与 OCR 全是 Win32 / WinRT 直接调用，**只能在 Windows 上编**，
    # 所以单独一个 job，不并进上面那个 ubuntu 的格式检查。
    #
    # 它验的是真实链路：WinRT apartment 初始化 → SoftwareBitmap → 中文 OCR 引擎
    # → 异步识别 → 取行；以及 GDI 的窗口枚举与整数定点放大。
    # 这几步各自的失败方式（apartment 模型不对、位图参数不符、语言包缺失、
    # 采样偏移写反）都只在真机上才暴露，靠 code review 看不出来。
    name: Rust 测试
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tauri 的依赖树编译很慢，缓存尽量让这条 job 别每次都重编一遍。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --lib
